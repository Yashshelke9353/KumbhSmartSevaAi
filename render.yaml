services:
  - type: web
    name: kumbh-smart-seva
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_PATH
        # On Render, use /tmp for ephemeral storage if no persistent volume
        # For production, consider using a PostgreSQL database instead
        value: /tmp/main.db
      - key: SECRET_KEY
        # This should be set in Render dashboard, not in code
        sync: false

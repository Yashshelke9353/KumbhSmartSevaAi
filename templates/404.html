{% extends "base.html" %}

{% block title %}Page Not Found - Kumbh Smart Seva{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-warning text-center p-5">
                <div class="card-body">
                    <i class="bi bi-file-earmark-x" style="font-size: 4rem; color: #f77f00;"></i>
                    <h1 class="card-title mt-4" style="color: #f77f00;">404 - Page Not Found</h1>
                    <p class="card-text text-muted">
                        The page you're looking for doesn't exist or has been moved.
                    </p>
                    
                    <div class="mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg me-2">
                            <i class="bi bi-house"></i> Go Home
                        </a>
                        <button class="btn btn-outline-secondary btn-lg" onclick="window.history.back();">
                            <i class="bi bi-arrow-left"></i> Go Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

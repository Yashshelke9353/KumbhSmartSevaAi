{% extends 'base.html' %}

{% block title %}Add Room{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>#map{height:400px;border-radius:10px;margin-bottom:10px;}</style>
{% endblock %}

{% block content %}
<div class="card p-4">
    <h4>Add Room / Owner Registration</h4>
    <form method="post" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Room name</label>
                <input name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Owner name</label>
                <input name="owner_name" class="form-control" required>
            </div>
            <div class="col-md-6 mt-3">
                <label class="form-label">Phone number</label>
                <input name="phone" class="form-control" required>
            </div>
            <div class="col-md-6 mt-3">
                <label class="form-label">Price per night (INR)</label>
                <input name="price" type="number" step="0.01" class="form-control" required>
            </div>
            <div class="col-12 mt-3">
                <label class="form-label">Address</label>
                <input name="address" class="form-control">
            </div>
            <div class="col-12 mt-3">
                <label class="form-label">Photo</label>
                <input type="file" name="photo" class="form-control">
            </div>
            <div class="col-12 mt-3">
                <h5>Facilities</h5>
                <div class="row g-2">
                    <div class="col-md-3">
                        <label class="form-label">Number of rooms</label>
                        <input name="num_rooms" type="number" min="1" class="form-control" value="1">
                    </div>
                    <div class="col-md-3 d-flex align-items-center">
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="water_facility" name="water_facility">
                            <label class="form-check-label" for="water_facility">Water facility</label>
                        </div>
                    </div>
                    <div class="col-md-3 d-flex align-items-center">
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="toilet_available" name="toilet_available">
                            <label class="form-check-label" for="toilet_available">Toilet available</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Bathroom type</label>
                        <select name="bathroom_type" class="form-select">
                            <option value="private">Private</option>
                            <option value="attached">Attached</option>
                            <option value="shared">Shared</option>
                        </select>
                    </div>
                    <div class="col-12 mt-2">
                        <label class="form-label">Security details (guards, CCTV, etc.)</label>
                        <input name="security" class="form-control" placeholder="e.g. CCTV, 24/7 guard">
                    </div>
                    <div class="col-12 mt-2">
                        <label class="form-label">Other amenities (comma separated)</label>
                        <input name="amenities" class="form-control" placeholder="e.g. wifi, linen, breakfast">
                    </div>
                </div>
            </div>
            <div class="col-12 mt-3">
                <label class="form-label">Select location (click on map)</label>
                <div id="map"></div>
                <div class="row">
                    <div class="col-md-6">
                        <input name="latitude" id="latitude" class="form-control" placeholder="Latitude" readonly required>
                    </div>
                    <div class="col-md-6">
                        <input name="longitude" id="longitude" class="form-control" placeholder="Longitude" readonly required>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-primary">Add Room</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([19.8950, 73.7850], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
    }).addTo(map);

    let marker = null;
    map.on('click', function(e){
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);
        if(marker) map.removeLayer(marker);
        marker = L.marker([lat,lng]).addTo(map);
        document.getElementById('latitude').value = lat;
        document.getElementById('longitude').value = lng;
    });
</script>
{% endblock %}
